<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.03); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(12px) scale(0.97); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes shimmerLine {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .anim-float-1 {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .anim-float-2 {
        animation: floatReverse 10s ease-in-out infinite;
      }
      .anim-pulse {
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 50px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 19px;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .text-pill {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
      }
      .text-badge {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Dynamic Ambient Glow Blobs in Background -->
  <g class="anim-pulse">
    <circle cx="180" cy="120" r="180" fill="url(#glowCyan)" />
    <circle cx="1020" cy="240" r="220" fill="url(#glowPurple)" />
    <circle cx="600" cy="180" r="250" fill="url(#glowBlue)" />
  </g>

  <!-- Dynamic Animated Tech Background Floating Particles (Behind text) -->
  <g class="anim-float-1" opacity="0.45">
    <circle cx="120" cy="90" r="3" fill="#38bdf8" />
    <circle cx="280" cy="50" r="2" fill="#818cf8" />
    <circle cx="1060" cy="100" r="3.5" fill="#c084fc" />
    <circle cx="940" cy="70" r="2" fill="#38bdf8" />
    <rect x="150" y="270" width="18" height="18" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <rect x="1020" y="90" width="22" height="22" rx="5" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4" />
  </g>
  <g class="anim-float-2" opacity="0.4">
    <circle cx="200" cy="300" r="3" fill="#06b6d4" />
    <circle cx="1080" cy="290" r="2.5" fill="#38bdf8" />
    <circle cx="890" cy="310" r="3.5" fill="#818cf8" />
    <polygon points="130,220 140,205 150,220" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4" />
    <polygon points="1070,170 1080,155 1090,170" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
  </g>

  <!-- Outer Card Border -->
  <rect x="2" y="2" width="1196" height="376" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- FOREGROUND CONTENT: Header Tag -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text text-anchor="middle" y="4" class="text-badge" fill="#38bdf8">⚡ CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <g transform="translate(600, 126)">
    <text text-anchor="middle" class="text-title" fill="url(#titleGrad)">Awesome OS Customization</text>
  </g>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <g transform="translate(600, 172)">
    <text text-anchor="middle" class="text-subtitle" fill="#94a3b8">
      The Premier Ecosystem for Image Slipstreaming, Bloatware Removal, OS Tweaks &amp; Bootable Media
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Decorative Divider Line -->
  <g transform="translate(600, 204)">
    <line x1="-320" y1="0" x2="320" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.8" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <circle cx="-120" cy="0" r="2.5" fill="#818cf8" />
    <circle cx="120" cy="0" r="2.5" fill="#818cf8" />
  </g>

  <!-- FOREGROUND CONTENT: Category Feature Badges / Pills -->
  <g transform="translate(600, 252)">
    <!-- Pill 1: Slipstreaming & ISOs -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="-18" width="215" height="36" rx="18" fill="url(#pillGrad1)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.7" />
      <text x="107" y="5" text-anchor="middle" class="text-pill" fill="#e0f2fe">💿 ISO Slipstreaming</text>
    </g>

    <!-- Pill 2: Bloatware Removal -->
    <g transform="translate(-225, 0)">
      <rect x="0" y="-18" width="215" height="36" rx="18" fill="url(#pillGrad2)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.7" />
      <text x="107" y="5" text-anchor="middle" class="text-pill" fill="#ede9fe">🧹 Bloatware Removal</text>
    </g>

    <!-- Pill 3: System Optimization -->
    <g transform="translate(10, 0)">
      <rect x="0" y="-18" width="215" height="36" rx="18" fill="url(#pillGrad1)" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.7" />
      <text x="107" y="5" text-anchor="middle" class="text-pill" fill="#e0f2fe">⚙️ Performance Tweaks</text>
    </g>

    <!-- Pill 4: Bootable Media -->
    <g transform="translate(245, 0)">
      <rect x="0" y="-18" width="215" height="36" rx="18" fill="url(#pillGrad3)" stroke="#10b981" stroke-width="1" stroke-opacity="0.7" />
      <text x="107" y="5" text-anchor="middle" class="text-pill" fill="#d1fae5">🚀 Bootable USB Tools</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Lower Tagline -->
  <g transform="translate(600, 325)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      🛡️ 100% Auditable • Scriptable Windows 10 &amp; 11 Customization • Open-Source &amp; Enterprise Solutions
    </text>
  </g>
</svg>
